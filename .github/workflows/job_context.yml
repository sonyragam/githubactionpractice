name: Job Status Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:

      - name: Step 1
        run: echo "Learning Job Context"

      - name: Print Job Status
        if: always()
        run: |
          echo "Job Status: ${{ job.status }}"
          echo "job container:${{job.container}}"
