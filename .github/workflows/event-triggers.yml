name: event

on:
  pull_request:
    branches:
      - main

    types:
      - reopened
  
      - ready_for_review

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: pull-request-closed
        if: github.event.pull_request.merged == true
        run: echo "PR is ready for review, starting validation pipeline"
